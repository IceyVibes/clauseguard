services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    image: clauseguard:latest
    command: ["uvicorn", "backend.app.main:app", "--host", "0.0.0.0", "--port", "8000"]
    ports:
      - "8000:8000"
    volumes:
      - ./backend/models:/app/backend/models:ro
    healthcheck:
      test: ["CMD", "python", "backend/healthcheck.py"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

  demo:
    build:
      context: .
      dockerfile: Dockerfile
    image: clauseguard:latest
    command: ["python", "demo/serve_demo.py"]
    environment:
      DEMO_HOST: "0.0.0.0"
      DEMO_PORT: "5500"
    ports:
      - "5500:5500"
